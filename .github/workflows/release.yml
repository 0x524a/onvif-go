name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: true

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    # Only builds and uploads a workflow artifact; doesn't touch releases or packages.
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          
          # Windows
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          
          # macOS
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          SHORT_SHA=${{ steps.version.outputs.SHORT_SHA }}
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${SHORT_SHA}"
          
          # Set file extension for Windows
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          
          # Build all CLI tools
          mkdir -p dist
          
          echo "🔨 Building onvif-cli..."
          go build -ldflags="${LDFLAGS}" -o "dist/onvif-cli-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/onvif-cli
          
          echo "🔨 Building onvif-quick..."
          go build -ldflags="${LDFLAGS}" -o "dist/onvif-quick-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/onvif-quick
          
          echo "🔨 Building onvif-server..."
          go build -ldflags="${LDFLAGS}" -o "dist/onvif-server-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/onvif-server
          
          echo "🔨 Building onvif-diagnostics..."
          go build -ldflags="${LDFLAGS}" -o "dist/onvif-diagnostics-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" ./cmd/onvif-diagnostics

      - name: Create archive
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          PLATFORM="${{ matrix.goos }}-${{ matrix.goarch }}"
          ARCHIVE_NAME="onvif-go-${VERSION}-${PLATFORM}"
          
          mkdir -p releases staging
          
          # Copy binaries with clean names (without platform suffix)
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp dist/onvif-cli-${{ matrix.goos }}-${{ matrix.goarch }}.exe staging/onvif-cli.exe
            cp dist/onvif-quick-${{ matrix.goos }}-${{ matrix.goarch }}.exe staging/onvif-quick.exe
            cp dist/onvif-server-${{ matrix.goos }}-${{ matrix.goarch }}.exe staging/onvif-server.exe
            cp dist/onvif-diagnostics-${{ matrix.goos }}-${{ matrix.goarch }}.exe staging/onvif-diagnostics.exe
          else
            cp dist/onvif-cli-${{ matrix.goos }}-${{ matrix.goarch }} staging/onvif-cli
            cp dist/onvif-quick-${{ matrix.goos }}-${{ matrix.goarch }} staging/onvif-quick
            cp dist/onvif-server-${{ matrix.goos }}-${{ matrix.goarch }} staging/onvif-server
            cp dist/onvif-diagnostics-${{ matrix.goos }}-${{ matrix.goarch }} staging/onvif-diagnostics
          fi
          
          # Copy documentation
          cp README.md LICENSE staging/ 2>/dev/null || true

          # MIT/BSD licenses ask for their notices to accompany binaries.
          # Generated here so it matches the modules built into this release.
          scripts/gen-third-party-notices.sh staging/THIRD_PARTY_NOTICES.md
          
          # Create archive from staging directory
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cd staging
            zip -r "../releases/${ARCHIVE_NAME}.zip" .
            cd ..
          else
            cd staging
            tar czf "../releases/${ARCHIVE_NAME}.tar.gz" .
            cd ..
          fi
          
          echo "✅ Created ${ARCHIVE_NAME}.tar.gz"

      - name: Generate checksums
        run: |
          cd releases
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt
          else
            shasum -a 256 * > checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: releases/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-releases
          pattern: release-*
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd all-releases
          # Combine all checksum files
          cat checksums-*.txt > checksums.txt 2>/dev/null || true
          # Remove individual checksum files
          rm -f checksums-*.txt

      - name: Get version and changelog
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          
          # Generate changelog from commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG=Initial release" >> $GITHUB_OUTPUT
          fi

      - name: Create Release (draft)
        # Created as a draft so every asset finishes uploading before the
        # release is publicly visible or immutable. Publishing (below)
        # happens only after all uploads here succeed - GitHub rejects
        # further asset uploads to an already-published release
        # ("Cannot upload assets to an immutable release"), which is what
        # broke v1.1.5/v1.1.6 when this was draft: false.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          files: all-releases/*
          draft: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-rc') || contains(steps.version.outputs.VERSION, '-beta') || contains(steps.version.outputs.VERSION, '-alpha') }}
          generate_release_notes: true
          body: |
            ## Release ${{ steps.version.outputs.VERSION }}
            
            ### 📦 Installation
            
            Download the appropriate binary for your platform below.
            
            #### Linux/macOS
            ```bash
            # Download and extract
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/onvif-go-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            tar xzf onvif-go-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            
            # Make executable and move to PATH
            chmod +x onvif-cli
            sudo mv onvif-cli /usr/local/bin/onvif-cli
            ```
            
            #### Windows
            Download the `.zip` file for your architecture and extract it.
            
            #### Go Library
            ```bash
            go get github.com/${{ github.repository }}@${{ steps.version.outputs.VERSION }}
            ```
            
            ### 🔐 Checksums
            
            SHA256 checksums are available in `checksums.txt`
            
            ### 📝 Changes
            
            ${{ steps.version.outputs.CHANGELOG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        run: gh release edit "${{ steps.version.outputs.VERSION }}" --draft=false --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    # packages: write is required to push to ghcr.io with GITHUB_TOKEN. The
    # workflow-level block this replaced only granted contents: write, which
    # left packages at the implicit "none" default — every push here would
    # have been rejected regardless of Docker Hub/GHCR auth.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            # Remove 'v' prefix if present
            VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
